<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>集中タイマー</title><style>body{background:#111710;color:#f1f4ed;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(80vw,400px);text-align:center}small{letter-spacing:.2em;color:#b8ef72}h1{font-size:26px;font-weight:500}#clock{font-size:80px;letter-spacing:-5px;font-variant-numeric:tabular-nums;margin:32px 0}button{border:0;border-radius:18px;padding:16px 24px;background:#b8ef72;color:#15210b;font:inherit;margin:4px}.quiet{background:#273122;color:#e5ebdf}p{color:#98a18f;line-height:1.8}input{width:60px;background:#273122;border:0;padding:10px;color:white;font:inherit;border-radius:8px}</style><div class="card"><small>BUILT ON YOUR PHONE</small><h1>集中タイマー</h1><div id="clock">25:00</div><button id="toggle">スタート</button><button class="quiet" id="reset">リセット</button><p><input id="minutes" type="number" min="1" max="180" value="25"> 分の集中時間</p><p>PocketForgeの端末内実行サンプル。<br>AIに「休憩タイマーも追加して」と指示できます。</p><p id="message"></p></div><script>let remaining=25*60,end=0,interval=null;const clock=document.getElementById('clock'),toggle=document.getElementById('toggle'),minutes=document.getElementById('minutes'),message=document.getElementById('message');function draw(){clock.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}function pause(){clearInterval(interval);interval=null;toggle.textContent='スタート'}toggle.onclick=()=>{if(interval){pause();return}if(remaining<=0)remaining=(Number(minutes.value)||25)*60;end=Date.now()+remaining*1000;toggle.textContent='一時停止';message.textContent='';interval=setInterval(()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));draw();if(!remaining){pause();message.textContent='集中時間が終わりました。'}},200)};document.getElementById('reset').onclick=()=>{pause();remaining=Math.max(1,Math.min(180,Number(minutes.value)||25))*60;message.textContent='';draw()};minutes.onchange=()=>document.getElementById('reset').click();draw();</script></html>
