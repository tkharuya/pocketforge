plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.haruyalab.pocketforge'
    compileSdk 36

    defaultConfig {
        applicationId 'jp.haruyalab.pocketforge'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
